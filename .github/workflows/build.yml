name: Build Mac & Windows

# ── Triggers ──────────────────────────────────────────────────────────────────
# Runs automatically on version tags (e.g. v1.0.0).
# Can also be triggered manually from the Actions tab; use the "platform" input
# to build only specific targets or all (default).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - mac-arm64
          - mac-intel
          - windows

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # macOS ARM64 Build (Apple Silicon — macos-latest / macos-14)
  # ────────────────────────────────────────────────────────────────────────────
  build-mac-arm64:
    name: Build macOS App (ARM64)
    runs-on: macos-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'mac' ||
      inputs.platform == 'mac-arm64'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Upgrade pip
        run: pip install --upgrade pip setuptools wheel

      - name: Install all requirements
        run: pip install -r requirements.txt

      # cp follows symlinks on macOS, so this copies the real binary.
      - name: Copy ffmpeg to assets
        run: |
          mkdir -p assets
          cp $(which ffmpeg) assets/ffmpeg

      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean --noconfirm

      - name: Zip app bundle
        run: |
          cd dist
          zip -r ReaperSessionGenerator-mac-arm64.zip ReaperSessionGenerator.app

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaperSessionGenerator-mac-arm64
          path: dist/ReaperSessionGenerator-mac-arm64.zip
          retention-days: 30


  # ────────────────────────────────────────────────────────────────────────────
  # macOS Intel Build (x86_64 — macos-13)
  # ────────────────────────────────────────────────────────────────────────────
  build-mac-intel:
    name: Build macOS App (Intel)
    runs-on: macos-13
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'mac' ||
      inputs.platform == 'mac-intel'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Upgrade pip
        run: pip install --upgrade pip setuptools wheel

      - name: Install all requirements
        run: pip install -r requirements.txt

      - name: Copy ffmpeg to assets
        run: |
          mkdir -p assets
          cp $(which ffmpeg) assets/ffmpeg

      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean --noconfirm

      - name: Zip app bundle
        run: |
          cd dist
          zip -r ReaperSessionGenerator-mac-intel.zip ReaperSessionGenerator.app

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaperSessionGenerator-mac-intel
          path: dist/ReaperSessionGenerator-mac-intel.zip
          retention-days: 30


  # ────────────────────────────────────────────────────────────────────────────
  # Windows Build
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - name: Upgrade pip
        run: pip install --upgrade pip setuptools wheel

      - name: Install all requirements
        run: pip install -r requirements.txt

      # Use the real ffmpeg binary from the Chocolatey lib tree, not the shim.
      # The Chocolatey shim (in bin/) uses a relative path that breaks when moved
      # into the PyInstaller bundle. Fall back to Get-Command if the path changes.
      - name: Copy ffmpeg to assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path assets
          $chocoBin = "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe"
          if (Test-Path $chocoBin) {
            Copy-Item $chocoBin assets\ffmpeg.exe
          } else {
            Copy-Item (Get-Command ffmpeg).Source assets\ffmpeg.exe
          }

      - name: Build with PyInstaller
        run: pyinstaller build.spec --clean --noconfirm

      - name: Zip output
        shell: powershell
        run: |
          Compress-Archive -Path dist\ReaperSessionGenerator\* `
            -DestinationPath dist\ReaperSessionGenerator-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReaperSessionGenerator-windows
          path: dist\ReaperSessionGenerator-windows.zip
          retention-days: 30


  # ────────────────────────────────────────────────────────────────────────────
  # Create a GitHub Release with all builds attached
  # Only runs when triggered by a tag push
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-mac-arm64, build-mac-intel, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download Mac ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: ReaperSessionGenerator-mac-arm64
          path: release/

      - name: Download Mac Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: ReaperSessionGenerator-mac-intel
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ReaperSessionGenerator-windows
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ReaperSessionGenerator-mac-arm64.zip
            release/ReaperSessionGenerator-mac-intel.zip
            release/ReaperSessionGenerator-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
